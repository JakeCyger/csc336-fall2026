<!DOCTYPE html>
<html>
    <head>
        <title>SE - Inventory Tool</title>
        <script src="script.js" defer></script>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div id="controls">
            <select id="filterBy"></select>
            <select id="sortBy">
                <option value="default">Sort By</option>
                <option value="price-asc">Price: Low to High</option>
                <option value="price-desc">Price: High to Low</option>
                <option value="name-asc">Name: A to Z</option>
            </select>
            <button id="resetShopButton" type="button">Reset Inventory</button>
            <button id="fillDummyData" type="button">(Fill with data)</button>
            <div id="inventoryFormDiv">
                <form id="inventoryForm">
                    <input placeholder="Name" id="nameField" required>
                    <input placeholder="Title" id="titleField" required>
                    <input type="number" step="0.1" placeholder="Price" id="priceField" required>
                    <textarea placeholder="Description" id="descField" required></textarea>
                    <select id="categorySelect" required>
                        <option value="" disabled selected>Category</option>
                    </select>
                    <input type="url" id="urlField" required>
                    <input type="submit" value="Create Item">
                </form>
            </div>
        </div>

        <div id="root"></div>

        <div id="cart">
            <button id="addSelected" disabled>Add Selected to Cart</button>
            <div id="cartItemsList"></div>
            <div id="cartTotal">Total: $0.00 (0 items)</div>
        </div>
    </body>
</html>
